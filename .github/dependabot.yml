version: 2
registries:
  spongepowered:
    type: maven-repository
    url: https://repo.spongepowered.org/repository/maven-public/
    # Public registry: declaring it allows its host through Dependabot's proxy.
    # No credentials are required.

updates:
  - package-ecosystem: gradle
    directory: /
    registries:
      - spongepowered
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      action-dependencies:
        patterns:
          - "*"
